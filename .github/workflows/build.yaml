name: Run Build

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      skip_cdn_upload:
        description: 'Upload to CDN?'
        type: boolean
        default: false
      appName:
        description: 'Custom App Name'
        required: true
        default: 'AppName'
      

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './cli'
          severity: warning
          
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false #Makes sure if one build fails the other build can still run 
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ./cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
            fetch-depth: 0
            
      - name: Set Custom Name To Build
        run: echo "APP_NAME=${{ github.event.inputs.appName || 'App-Name' }}" >> $GITHUB_ENV
        
      - name: Upload to CDN
        if: ${{ github.event.inputs.skip_cdn_upload == 'true' }}
        run: echo "Uploading to CDN..."
        
      - name: Check on OS
        run: echo "This job is running on ${{ runner.os}}"
        
      - name: Install XcodeGen
        if: matrix.os == 'macos-latest'
        run: brew install xcodegen

      - name: Generate Xcode Project
        if: matrix.os == 'macos-latest'
        run: xcodegen generate --spec ./project.yml

      - name: Build for IOS Simulator(macos only)
        working-directory: ./MyFolder
        if: matrix.os == 'macos-latest'
        run: |
          xcodebuild build \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPad (10th generation),OS=18.5" \
            -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
        
      - name: Creating Version Number
        run: echo "Getting version number"  
      - uses: paulhatch/semantic-version@v5.4.0
        with:
            bump_each_commit: true

        # Issue here was spaces between appName and "Test App" And removing $ in appName
        # needed Perms to make this work
      # CLI call to simulated build process
      - name: Run Build
        run: |
          chmod +x ./build.sh 
          ./build.sh --platform Android --project-name ${APP_NAME}
        
      # Issue below was because of a " not being closed.
      # CLI call to simulated upload process
      - name: Upload
        run: |
          chmod +x ./upload.sh

      - name: Profile Build Script
        run: |
          export PS4='+ $(date "+%s.%N") '
          # Run the script. If it fails (||), print the log for the engineer
          bash -x ./build.sh --platform Android --project-name "${{ env.APP_NAME }}" > profile.log 2>&1 || (echo "BUILD FAILED - VIEWING PROFILE LOG:" && cat profile.log && exit 1)

      - name: Upload Profile Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-profile-${{ matrix.os }}
          path: cli/profile.log

      - name: Performance Report
        if: always()
        run: |
          echo "### Performance Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Upload | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| OS | ${{ matrix.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "#### Potential Bottlenecks" >> $GITHUB_STEP_SUMMARY
          echo "- **Network:** Check if \`upload.sh\` latency is high." >> $GITHUB_STEP_SUMMARY
          echo "- **Disk I/O:** Large artifacts can slow down the \`upload-artifact\` step." >> $GITHUB_STEP_SUMMARY
          echo "- **Cold Start:** macOS runners typically take 1-2 minutes longer to provision than Linux." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> Compare the **Profiling Logs** in artifacts to see which specific line in your script is stalling." >> $GITHUB_STEP_SUMMARY
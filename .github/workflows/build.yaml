name: Run Build

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      skip_cdn_upload:
        description: 'Upload to CDN?'
        type: boolean
        default: false
      appName:
        description: 'Custom App Name'
        required: true
        default: 'AppName'
      

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ./cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
            fetch-depth: 0
            
      - name: Set Custom Name To Build
        run: echo "APP_NAME=${{ github.event.inputs.appName || 'App-Name' }}" >> $GITHUB_ENV
        
      - name: Upload to CDN
        if: ${{ github.event.inputs.skip_cdn_upload == 'true' }}
        run: echo "Uploading to CDN..."
        
      - name: Check on OS
        run: echo "This job is running on ${{ runner.os}}"
        
      - name: Install XcodeGen
        if: matrix.os == 'macos-latest'
        run: brew install xcodegen

      - name: Generate Xcode Project
        if: matrix.os == 'macos-latest'
        run: xcodegen generate --spec ./project.yml

      - name: Build for IOS Simulator(macos only)
        working-directory: ./cli
        if: matrix.os == 'macos-latest'
        run: |
          xcodebuild build \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.APP_NAME }}" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPad (10th generation),OS=18.5" \
            -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
        
      - name: Creating Version Number
        run: echo "Getting version number"  
      - uses: paulhatch/semantic-version@v5.4.0
        with:
            bump_each_commit: true

      - name: Profile Script Execution
        run: |
          # Enable XTRACE and use a custom PS4 to add high-precision timestamps
          export PS4='+ $(date "+%s.%N") '
          bash -x ./build.sh > script_profile.log 2>&1

      - name: Upload Profile Log
        if: always() # Recommended so it uploads even if the script fails
        uses: actions/upload-artifact@v4
        with:
          name: shell-profile
          path: script_profile.log


        # Issue here was spaces between appName and "Test App" And removing $ in appName
        # needed Perms to make this work
      # CLI call to simulated build process
      - name: Run Build
        run: |
          chmod +x ./build.sh 
          ./build.sh --platform Android --project-name ${APP_NAME}
        
      # Issue below was because of a " not being closed.
      # CLI call to simulated upload process
      - name: Upload
        run: |
          chmod +x ./upload.sh

      
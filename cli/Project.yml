name: ${APP_NAME}
targets:
  ${APP_NAME}:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .

    settings:
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      PRODUCT_BUNDLE_IDENTIFIER: "com.example.${APP_NAME}"